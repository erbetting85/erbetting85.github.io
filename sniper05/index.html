<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121418">
<title>Sniper 0,5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icona-192.png">
<link rel="apple-touch-icon" href="icona-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #121418; color: #f1f1ee;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #121418; }
  #fermo { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  #fermo img { width: 88px; height: 88px; border-radius: 20px; }
  #fermo h1 { margin: 0; font-size: 22px; }
  #fermo h1 b { color: #e3b84a; }
  #fermo p { margin: 0; max-width: 420px; color: #b4b7bf; }
  #fermo form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; }
  #codice { font: inherit; font-size: 15px; padding: 12px; border-radius: 12px; border: 1px solid #2c3038; background: #1b1e24;
    color: #f1f1ee; min-height: 76px; resize: none; box-sizing: border-box; width: 100%; }
  .tasto { appearance: none; border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 700;
    background: #e3b84a; color: #15171b; cursor: pointer; }
  .tasto.chiaro { background: #1b1e24; color: #f1f1ee; border: 1px solid #2c3038; }
  #esito { min-height: 1.4em; color: #e3b84a; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<!-- Sniper 0,5: questa pagina e' pubblica ma non contiene niente di privato. L'indirizzo dell'app web e la chiave arrivano
     una volta sola dal link di attivazione (la parte dopo il #, che il browser non manda a nessun server) oppure dal codice
     incollato qui sotto, e restano solo su questo telefono. Senza attivazione mostra solo il riquadro per collegarsi. -->
<div id="fermo" hidden>
  <img src="icona-192.png" alt="">
  <h1>Sniper <b>0,5</b></h1>
  <p>Questo telefono non è ancora collegato. Apri il <b>link di attivazione</b> che hai ricevuto, oppure incolla qui sotto
    il codice o il link.</p>
  <form id="modulo" autocomplete="off">
    <textarea id="codice" placeholder="Tieni premuto qui e scegli Incolla" spellcheck="false" autocapitalize="off"></textarea>
    <button class="tasto" type="submit">Collega</button>
    <button class="tasto chiaro" type="button" id="incolla" hidden>Incolla dagli appunti</button>
  </form>
  <div id="esito" role="status"></div>
</div>
<script>
(function () {
  var NOME = 'sniper05_app', FORMA = /(AKfyc[\w-]{20,})\.([0-9a-f]{32})/;
  // va bene anche il link lungo del sito (pulsante «APRI IL SITO»): .../macros/s/<id>/exec?chiave=<chiave>...
  var LUNGO = /\/s\/(AKfyc[\w-]{20,})\/exec\?(?:[^#\s]*&)?chiave=([0-9a-f]{32})/;
  function trova(t) { t = String(t || '').replace(/&amp;/g, '&'); return FORMA.exec(t) || LUNGO.exec(t); }

  function leggi() { try { return localStorage.getItem(NOME) || ''; } catch (e) { return ''; } }
  function salva(v) {
    try { localStorage.setItem(NOME, v); } catch (e) {}
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    return leggi() === v;
  }
  function apri(m) {
    document.getElementById('fermo').hidden = true;
    var f = document.createElement('iframe');
    f.id = 'app'; f.title = 'Sniper 0,5'; f.referrerPolicy = 'no-referrer';
    f.src = 'https://script.google.com/macros/s/' + m[1] + '/exec?chiave=' + m[2] + '&sito=1&app=1';
    document.body.appendChild(f);
  }
  function collega(testo) {
    var m = trova(testo);
    var esito = document.getElementById('esito');
    var inizio = String(testo || '').trim().slice(0, 12);
    if (!m) { esito.textContent = inizio ? 'Codice non valido: hai incollato un testo che inizia con «' + inizio + '…».'
      : 'La casella è vuota: tieni premuto nella casella e scegli Incolla.'; return; }
    var ok = salva(m[1] + '.' + m[2]);
    if (!ok) esito.textContent = 'Collegato solo per adesso: questo telefono non lascia salvare il codice.';
    apri(m);
  }

  var h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (location.hash) history.replaceState(null, '', location.pathname);  // il codice non resta nella barra ne' nella cronologia
  var m = FORMA.exec(h);
  if (m) { salva(m[1] + '.' + m[2]); return apri(m); }
  m = FORMA.exec(leggi());
  if (m) return apri(m);

  document.getElementById('fermo').hidden = false;
  document.getElementById('modulo').addEventListener('submit', function (e) {
    e.preventDefault(); collega(document.getElementById('codice').value);
  });
  if (navigator.clipboard && navigator.clipboard.readText) {
    var b = document.getElementById('incolla'); b.hidden = false;
    b.addEventListener('click', function () {
      navigator.clipboard.readText().then(function (t) { document.getElementById('codice').value = t; collega(t); })
        .catch(function () { document.getElementById('esito').textContent = 'Tieni premuto nel riquadro e scegli Incolla.'; });
    });
  }
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
